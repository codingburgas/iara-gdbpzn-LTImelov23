{% extends "base.html" %}
{% block title %}{{ title }} - ГДПБЗН{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="fas fa-plus-circle"></i> {{ title }}</h1>
</div>
<div class="card">
    <div class="card-body">
        <form method="POST" class="form">
            {{ form.hidden_tag() }}
            <div class="form-row">
                <div class="form-group col-6">
                    <label>{{ form.name.label }}</label>
                    {{ form.name(class="form-control") }}
                </div>
                <div class="form-group col-3">
                    <label>{{ form.shift.label }}</label>
                    {{ form.shift(class="form-control") }}
                </div>
                <div class="form-group col-3">
                    <label>{{ form.leader_id.label }}</label>
                    {{ form.leader_id(class="form-control") }}
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Запази</button>
                <a href="{{ url_for('team_list') }}" class="btn btn-outline">Отказ</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
